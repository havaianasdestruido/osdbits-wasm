name: CI

on:
  push:
    branches: [master, "arena/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- CPU only
  core:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/osdbits-core
      - name: Formatting
        run: cargo fmt --manifest-path crates/osdbits-core/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/osdbits-core/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path crates/osdbits-core/Cargo.toml
      - name: Property campaigns
        run: cargo test --manifest-path crates/osdbits-core/Cargo.toml --test properties

  wasm:
    name: WASM build + Node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/osdbits-core
      - name: Build
        run: cargo build --manifest-path crates/osdbits-core/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Smoke test (ABI, layout, determinism, bounds)
        run: node scripts/wasm-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: osdbits-core-wasm
          path: crates/osdbits-core/target/wasm32-unknown-unknown/release/osdbits_core.wasm

  web:
    name: Web (typecheck, unit, bundle)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the wasm the tests load
        run: bash scripts/build-wasm.sh
      - run: npm ci --prefix web
      - name: Typecheck (strict)
        run: npm --prefix web run typecheck
      - name: Unit + integration tests
        run: npm --prefix web test
      - name: Production bundle
        run: npm --prefix web run build

  guards:
    name: Provenance and asset guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upstream sources untouched
        run: bash scripts/check-upstream-untouched.sh
      - name: No proprietary assets
        run: bash scripts/check-no-proprietary-assets.sh

  # ------------------------------------------------------- GPU / browser only
  e2e:
    name: Browser E2E (capability-gated)
    runs-on: ubuntu-latest
    needs: [wasm, web]
    # A GPU (or at least a software adapter) may be unavailable on runners, and
    # the specs assert either the WebGPU or the documented fallback path, so a
    # failure here is reported but does not block the CPU gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/build-wasm.sh
      - run: npm ci --prefix web
      - name: Install browsers
        run: npx --prefix web playwright install --with-deps chromium firefox webkit
      - name: Run E2E
        run: npm --prefix web run e2e
      - name: Summarise failures as annotations
        if: always()
        run: node web/scripts/e2e-summary.mjs web/test-results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
