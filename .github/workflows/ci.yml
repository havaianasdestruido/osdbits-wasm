name: ci

on:
  push:
  pull_request:

jobs:
  cpu:
    name: cpu-only gates (rust + typescript + wasm + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      # Rules live in scripts/check-firmware.mjs so that
      # tests/unit/ci-firmware-guard.test.ts can assert both directions:
      # firmware/extracted resources fail, and the VU microcode provenance
      # (vucode_*.vu, vucode_*.vsm) is never mistaken for an extracted resource.
      - name: reject proprietary firmware in the tree
        run: git ls-files | node scripts/check-firmware.mjs

  gpu:
    name: gpu gates (playwright + webgpu)
    runs-on: ubuntu-latest
    needs: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:wasm
      - run: npx playwright test
